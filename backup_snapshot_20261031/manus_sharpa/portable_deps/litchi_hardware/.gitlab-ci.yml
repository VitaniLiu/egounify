workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - validate
  - test
  - build
  - ros2
  - release

default:
  interruptible: true

variables:
  GIT_LFS_SKIP_SMUDGE: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ROOT_USER_ACTION: ignore
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIXI_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pixi"

.python-job:
  image:
    name: "python:${PYTHON_VERSION}-bookworm"
  cache:
    key: "pip-${PYTHON_VERSION}"
    paths:
      - .cache/pip/
  before_script:
    - python --version
    - python tools/check_lfs_assets.py
    - >-
      apt-get update &&
      apt-get install --yes --no-install-recommends
      binutils libcap2 libudev1 libusb-1.0-0 zlib1g &&
      rm -rf /var/lib/apt/lists/*

lint:
  stage: validate
  image:
    name: python:3.13-bookworm
  cache:
    key: pip-lint
    paths:
      - .cache/pip/
  before_script:
    - python -m pip install "ruff>=0.15.9,<0.16"
  script:
    - ruff check src tests ros2/src examples tools hatch_build.py

unit-test:
  extends: .python-job
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
  script:
    - python -m pip install --editable ".[all,dev]"
    - pytest

wheel:
  extends: .python-job
  stage: build
  parallel:
    matrix:
      - PYTHON_VERSION:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
  script:
    - python -m pip install "build>=1.2"
    - python -m build --wheel
    - python -m pip install --force-reinstall --no-deps dist/*.whl
    - >-
      python -c
      "import importlib.metadata, litchi_hardware;
      from litchi_hardware import linker, manus, sharpa, xynova;
      print(importlib.metadata.version('litchi-hardware'))"
  artifacts:
    name: "litchi-hardware-${CI_COMMIT_REF_SLUG}-python-${PYTHON_VERSION}"
    paths:
      - dist/*.whl
    expire_in: 2 weeks

ros2-test:
  stage: ros2
  image:
    name: ghcr.io/prefix-dev/pixi:0.73.0
    entrypoint: [""]
  cache:
    key:
      files:
        - pixi.lock
      prefix: pixi-ros2
    paths:
      - .cache/pixi/
  before_script:
    - pixi --version
    - python tools/check_lfs_assets.py
    # The workspace setup file is generated by the first colcon build, while
    # Pixi's ROS environment also lists it as an activation script.
    - mkdir -p ros2/install
    - touch ros2/install/setup.bash
  script:
    - pixi run -e ros2 ros-build
    - pixi run -e ros2 ros-test
  rules:
    - changes:
        - pixi.toml
        - pixi.lock
        - pyproject.toml
        - src/**/*
        - ros2/**/*
        - tools/**/*
  artifacts:
    when: always
    paths:
      - ros2/log/
    expire_in: 1 week

release-internal-pypi:
  stage: release
  image:
    name: python:3.13-bookworm
  needs:
    - job: wheel
      artifacts: true
  before_script:
    - python -m pip install "twine>=6,<7"
  script:
    - |
      package_version="$(
        python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
      )"
      test "$CI_COMMIT_TAG" = "v$package_version" || {
        echo "tag $CI_COMMIT_TAG does not match package version $package_version" >&2
        exit 1
      }
    - >-
      twine upload
      --non-interactive
      --repository-url "$TWINE_REPOSITORY_URL"
      dist/*.whl
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
    - when: never
  interruptible: false
