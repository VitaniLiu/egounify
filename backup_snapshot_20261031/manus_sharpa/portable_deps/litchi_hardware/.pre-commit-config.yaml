minimum_pre_commit_version: "4.0.0"
default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: pixi run ruff check --force-exclude
        language: system
        types:
          - python
        stages:
          - pre-commit

      - id: pytest
        name: pytest
        entry: pixi run test
        language: system
        pass_filenames: false
        stages:
          - pre-push

