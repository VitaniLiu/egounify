/tj/gento_replay_node:
  ros__parameters:
    ros_namespace: tj
    core_record_topics:
    - joint_states
    - info/joint_feedback
    - info/eef_left
    - info/eef_right
    - info/base_local_state
    - info/base_local_odom
    - info/base_closure_error
    - info/base_teleop/active_mode
    - info/base_teleop/wholebody_holding
    - info/base_teleop/reanchor_seq
    - move/State
    - move/ManualMoveCmd
    - control/base_controller/cmd_vel
    - info/ik_request_mux/active_source
    - info/joint_cmd_mux/active_source
    - info/vr_connected
    - control/ik_request/vr
    - control/ik_request
    - control/ik_result
    - control/joint_cmd_A
    - control/joint_cmd_B
    - control/joint_cmd_body
    - control/joint_cmd_head
    - control/target_poseL
    - control/target_poseR
    - control/vr_body
    - control/enableL
    - control/enableR
    - control/footkey
    - control/vr_joy_L
    - control/vr_joy_R
    - control/gripperValueL
    - control/gripperValueR
    - info/gripper_feedback_L
    - info/gripper_feedback_R
    - info/gripper_feedback_L_err
    - info/gripper_feedback_R_err
    - info/gripper_state_L
    - info/gripper_state_R
    global_record_topics:
    - /hand_left/joint_commands
    - /hand_left/joint_states
    - /hand_right/joint_commands
    - /hand_right/joint_states
    - /target_pose
    - /controller/odom
    - /info/base_local_odom
    - /recording/chassis/state
    - /recording/chassis/odom
    - /recording/chassis/stm32
    - /recording/chassis/motors
    - /recording/chassis/batteries
    - /recording/chassis/manual_move_cmd
    - /recording/chassis/auto_move_cmd
    - /recording/chassis/bridge_status
    - /recording/gamepad/joy
    - /recording/gamepad/command
    - /recording/gamepad/status
    hand_left_topic: /hand_left/joint_commands
    hand_right_topic: /hand_right/joint_commands
    gripper_left_topic: control/gripperValueL
    gripper_right_topic: control/gripperValueR
    storage_id: mcap
    subscription_qos_depth: 1000
    write_queue_warn_threshold: 500
    max_write_queue: 20000
    topic_scan_interval_sec: 1.0
    record_camera: true
    camera_required: false
    camera_service: /recorder/set_recording
    camera_service_timeout_sec: 1.0
    video_dir_name: video
